[flake8]
max-line-length = 100
extend-ignore = E203, W503, E402, E501
exclude =
    py_modules,
    runtime_wheels,
    node_modules,
    dist,
    release,
    proprietary,
    .venv-pep8,
    __pycache__
per-file-ignores =
    # Decky plugin entrypoints may adjust sys.path before third-party imports.
    main.py:E402
    eink_daemon.py:E402
    desktop_app.py:E402
